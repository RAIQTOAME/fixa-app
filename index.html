    function translateDbValue(value, map, lang) {
      if (!value) return '';
      const raw = String(value).trim();
      const entry = map[raw] || map[raw.toLowerCase()];
      if (!entry) return raw;
      return entry[lang] || entry.en || raw;
    }

    function getLocalizedField(record, field, lang) {
      if (!record) return '';
      const localizedKey = `${field}_${lang}`;
      const localizedVal = record[localizedKey];
      if (typeof localizedVal === 'string' && localizedVal.trim() !== '') {
        return localizedVal;
      }
      return record[field] || '';
    }

    let currentLang = 'en';

    function applyLanguage(lang) {
      currentLang = TRANSLATIONS[lang] ? lang : 'en';
      const t = TRANSLATIONS[currentLang];
      const isRtl = RTL_LANGS.includes(currentLang);

      document.documentElement.lang = currentLang;
      document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
      document.getElementById('langSelect').value = currentLang;

      document.getElementById('t-app-name').textContent = t.appName;
      document.getElementById('t-subtitle').textContent = t.subtitle;
      document.getElementById('t-lang-label').textContent = t.langLabel;
      document.getElementById('t-refresh').textContent = t.refresh;
      document.getElementById('t-card-assets').textContent = t.cardAssets;
      document.getElementById('t-card-wo').textContent = t.cardWo;
      document.getElementById('t-card-pm').textContent = t.cardPm;
      document.getElementById('t-sec-wo').textContent = t.secWo;
      document.getElementById('t-sec-assets').textContent = t.secAssets;
      document.getElementById('t-sec-pm').textContent = t.secPm;
      document.getElementById('th-wo-num').textContent = t.thCode;
      document.getElementById('th-wo-title').textContent = t.thTitle;
      document.getElementById('th-wo-site').textContent = t.thSite;
      document.getElementById('th-wo-prio').textContent = t.thPriority;
      document.getElementById('th-wo-status').textContent = t.thStatus;
    }

    document.getElementById('langSelect').addEventListener('change', (e) => {
      applyLanguage(e.target.value);
      loadAllData();
    });

    async function loadAllData() {
      const t = TRANSLATIONS[currentLang];
      const banner = document.getElementById('statusBanner');

      if (!SUPABASE_KEY || SUPABASE_KEY === 'YOUR_PUBLISHABLE_KEY_HERE') {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800 border border-amber-200';
        banner.textContent = t.keyMissing;
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      try {
        const [assetsRes, woRes, pmRes] = await Promise.all([
          client.from('assets').select('*').order('asset_code', { ascending: true }),
          client.from('work_orders').select('*').order('created_at', { ascending: false }),
          client.from('preventive_maintenance').select('*').order('next_due_at', { ascending: true })
        ]);

        if (assetsRes.error) throw assetsRes.error;
        if (woRes.error) throw woRes.error;
        if (pmRes.error) throw pmRes.error;

        const assets = assetsRes.data || [];
        const workOrders = woRes.data || [];
        const pmListData = pmRes.data || [];

        document.getElementById('count-assets').textContent = assets.length;
        document.getElementById('count-wo').textContent = workOrders.length;
        document.getElementById('count-pm').textContent = pmListData.length;

        const woBody = document.getElementById('woTableBody');
        woBody.innerHTML = workOrders.map(wo => `
          <tr>
            <td class="py-2.5 px-3 font-medium">${wo.wo_number || ''}</td>
            <td class="py-2.5 px-3">${getLocalizedField(wo, 'title', currentLang)}</td>
            <td class="py-2.5 px-3">${getLocalizedField(wo, 'site_name', currentLang)}</td>
            <td class="py-2.5 px-3">${translateDbValue(wo.priority, PRIORITY_MAP, currentLang)}</td>
            <td class="py-2.5 px-3"><span class="px-2 py-1 rounded-full text-xs bg-slate-100">${translateDbValue(wo.status, STATUS_MAP, currentLang)}</span></td>
          </tr>
        `).join('');

        const assetsListEl = document.getElementById('assetsList');
        assetsListEl.innerHTML = assets.map(a => `
          <li class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
            <div>
              <div class="font-semibold">${getLocalizedField(a, 'name', currentLang)} <span class="text-xs text-slate-500">(${a.asset_code || ''})</span></div>
              <div class="text-xs text-slate-500">${getLocalizedField(a, 'site_name', currentLang)} • ${getLocalizedField(a, 'category', currentLang)}</div>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">${translateDbValue(a.status, STATUS_MAP, currentLang)}</span>
          </li>
        `).join('');

        const pmListEl = document.getElementById('pmList');
        pmListEl.innerHTML = pmListData.map(pm => `
          <li class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
            <div>
              <div class="font-semibold">${getLocalizedField(pm, 'title', currentLang)} <span class="text-xs text-slate-500">(${pm.pm_code || ''})</span></div>
              <div class="text-xs text-slate-500">${getLocalizedField(pm, 'site_name', currentLang)} • ${getLocalizedField(pm, 'frequency', currentLang)}</div>
            </div>
            <span class="text-xs text-slate-600">${getLocalizedField(pm, 'assigned_technician', currentLang)}</span>
          </li>
        `).join('');

        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-emerald-50 text-emerald-800 border border-emerald-200';
        banner.textContent = t.connected;
      } catch (err) {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-red-50 text-red-800 border border-red-200';
        banner.textContent = t.loadError + (err.message || err);
      }
    }

    loadAllData();
