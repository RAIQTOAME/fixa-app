<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixa — Building & Facilities Maintenance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app" class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Header & Language Switcher -->
    <header class="bg-white border border-slate-200 rounded-2xl p-4 md:p-5 shadow-sm flex flex-wrap items-center justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-blue-600 text-white font-bold text-lg">F</span>
          <h1 id="t-app-name" class="text-xl md:text-2xl font-bold text-slate-900">Fixa</h1>
        </div>
        <p id="t-subtitle" class="text-sm text-slate-500 mt-1">Building & Facilities Maintenance Platform</p>
      </div>

      <div class="flex items-center gap-2">
        <label id="t-lang-label" for="langSelect" class="text-sm font-medium text-slate-600">Language:</label>
        <select id="langSelect" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="en">English (EN)</option>
          <option value="he">עברית (HE)</option>
          <option value="ar">العربية (AR)</option>
          <option value="ru">Русский (RU)</option>
          <option value="es">Español (ES)</option>
          <option value="fr">Français (FR)</option>
          <option value="it">Italiano (IT)</option>
          <option value="de">Deutsch (DE)</option>
        </select>
        <button onclick="loadAllData()" class="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition">
          <span id="t-refresh">Refresh</span>
        </button>
      </div>
    </header>

    <!-- Status Banner -->
    <div id="statusBanner" class="mb-6 text-sm rounded-xl px-4 py-3 bg-blue-50 text-blue-800 border border-blue-200">
      Connecting to Supabase...
    </div>

    <!-- Summary Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div id="t-card-assets" class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Assets</div>
        <div id="count-assets" class="text-2xl font-bold mt-1 text-slate-900">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div id="t-card-wo" class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Work Orders</div>
        <div id="count-wo" class="text-2xl font-bold mt-1 text-slate-900">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div id="t-card-pm" class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Preventive Maintenance</div>
        <div id="count-pm" class="text-2xl font-bold mt-1 text-slate-900">0</div>
      </div>
    </section>

    <!-- New Work Order Form -->
    <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm mb-6">
      <h2 id="t-form-wo-title" class="text-lg font-bold mb-4">New Work Order</h2>
      <form id="woForm" onsubmit="createWorkOrder(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3 items-end">
        <div>
          <label id="lbl-wo-code" for="woCodeInput" class="block text-xs font-semibold text-slate-600 mb-1">Code</label>
          <input id="woCodeInput" type="text" required placeholder="WO-2483" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="lg:col-span-2">
          <label id="lbl-wo-title" for="woTitleInput" class="block text-xs font-semibold text-slate-600 mb-1">Title</label>
          <input id="woTitleInput" type="text" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label id="lbl-wo-site" for="woSiteInput" class="block text-xs font-semibold text-slate-600 mb-1">Site</label>
          <input id="woSiteInput" type="text" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label id="lbl-wo-prio" for="woPrioritySelect" class="block text-xs font-semibold text-slate-600 mb-1">Priority</label>
          <select id="woPrioritySelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option id="opt-prio-low" value="נמוך">Low</option>
            <option id="opt-prio-med" value="בינוני" selected>Medium</option>
            <option id="opt-prio-high" value="גבוה">High</option>
          </select>
        </div>

        <div>
          <label id="lbl-wo-status" for="woStatusSelect" class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
          <select id="woStatusSelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option id="opt-st-prog" value="בטיפול" selected>In Progress</option>
            <option id="opt-st-insp" value="דורש בדיקה">Needs Inspection</option>
            <option id="opt-st-ok" value="תקין">Operational</option>
          </select>
        </div>

        <div class="lg:col-span-6 flex justify-end mt-1">
          <button id="btn-wo-submit" type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition">
            Add Work Order
          </button>
        </div>
      </form>
    </section>

    <!-- Work Orders Section -->
    <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm mb-6">
      <h2 id="t-sec-wo" class="text-lg font-bold mb-4">Work Orders</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500">
              <th id="th-wo-num" class="py-2 px-3 text-start">Code</th>
              <th id="th-wo-title" class="py-2 px-3 text-start">Title</th>
              <th id="th-wo-site" class="py-2 px-3 text-start">Site</th>
              <th id="th-wo-prio" class="py-2 px-3 text-start">Priority</th>
              <th id="th-wo-status" class="py-2 px-3 text-start">Status</th>
            </tr>
          </thead>
          <tbody id="woTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- Assets & PM Grid -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
        <h2 id="t-sec-assets" class="text-lg font-bold mb-4">Assets & Systems</h2>
        <ul id="assetsList" class="space-y-3 text-sm"></ul>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
        <h2 id="t-sec-pm" class="text-lg font-bold mb-4">Preventive Maintenance</h2>
        <ul id="pmList" class="space-y-3 text-sm"></ul>
      </div>
    </section>
  </div>
