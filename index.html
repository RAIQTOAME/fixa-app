<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixa — Building & Facilities Maintenance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app" class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Header & Language Switcher -->
    <header class="bg-white border border-slate-200 rounded-2xl p-4 md:p-5 shadow-sm flex flex-wrap items-center justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-blue-600 text-white font-bold text-lg">F</span>
          <h1 id="t-app-name" class="text-xl md:text-2xl font-bold text-slate-900">Fixa</h1>
        </div>
        <p id="t-subtitle" class="text-sm text-slate-500 mt-1">Building & Facilities Maintenance Platform</p>
      </div>

      <div class="flex items-center gap-2">
        <label id="t-lang-label" for="langSelect" class="text-sm font-medium text-slate-600">Language:</label>
        <select id="langSelect" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="en">English (EN)</option>
          <option value="he">עברית (HE)</option>
          <option value="ar">العربية (AR)</option>
          <option value="ru">Русский (RU)</option>
          <option value="es">Español (ES)</option>
          <option value="fr">Français (FR)</option>
          <option value="it">Italiano (IT)</option>
          <option value="de">Deutsch (DE)</option>
        </select>
        <button onclick="loadAllData()" class="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition">
          <span id="t-refresh">Refresh</span>
        </button>
      </div>
    </header>

    <!-- Status Banner -->
    <div id="statusBanner" class="mb-6 text-sm rounded-xl px-4 py-3 bg-blue-50 text-blue-800 border border-blue-200">
      Connecting to Supabase...
    </div>

    <!-- Summary Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div id="t-card-assets" class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Assets</div>
        <div id="count-assets" class="text-2xl font-bold mt-1 text-slate-900">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div id="t-card-wo" class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Work Orders</div>
        <div id="count-wo" class="text-2xl font-bold mt-1 text-slate-900">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div id="t-card-pm" class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Preventive Maintenance</div>
        <div id="count-pm" class="text-2xl font-bold mt-1 text-slate-900">0</div>
      </div>
    </section>

    <!-- New Work Order Form -->
    <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm mb-6">
      <h2 id="t-form-wo-title" class="text-lg font-bold mb-4">New Work Order</h2>
      <form id="woForm" onsubmit="createWorkOrder(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3 items-end">
        <div>
          <label id="lbl-wo-code" for="woCodeInput" class="block text-xs font-semibold text-slate-600 mb-1">Code</label>
          <input id="woCodeInput" type="text" required placeholder="WO-2483" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="lg:col-span-2">
          <label id="lbl-wo-title" for="woTitleInput" class="block text-xs font-semibold text-slate-600 mb-1">Title</label>
          <input id="woTitleInput" type="text" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label id="lbl-wo-site" for="woSiteInput" class="block text-xs font-semibold text-slate-600 mb-1">Site</label>
          <input id="woSiteInput" type="text" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label id="lbl-wo-prio" for="woPrioritySelect" class="block text-xs font-semibold text-slate-600 mb-1">Priority</label>
          <select id="woPrioritySelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option id="opt-prio-low" value="נמוך">Low</option>
            <option id="opt-prio-med" value="בינוני" selected>Medium</option>
            <option id="opt-prio-high" value="גבוה">High</option>
          </select>
        </div>

        <div>
          <label id="lbl-wo-status" for="woStatusSelect" class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
          <select id="woStatusSelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option id="opt-st-prog" value="בטיפול" selected>In Progress</option>
            <option id="opt-st-insp" value="דורש בדיקה">Needs Inspection</option>
            <option id="opt-st-ok" value="תקין">Operational</option>
          </select>
        </div>

        <div class="lg:col-span-6 flex justify-end mt-1">
          <button id="btn-wo-submit" type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition">
            Add Work Order
          </button>
        </div>
      </form>
    </section>

    <!-- Edit Work Order Panel (Hidden by default) -->
    <section id="editWoSection" class="hidden bg-amber-50/60 border border-amber-300 rounded-2xl p-5 shadow-sm mb-6">
      <h2 id="t-edit-wo-title" class="text-lg font-bold mb-4 text-amber-950">Edit Work Order</h2>
      <form id="editWoForm" onsubmit="saveWorkOrderEdit(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3 items-end">
        <input id="editWoId" type="hidden" />
        <input id="editWoOriginalNum" type="hidden" />

        <div>
          <label id="edit-lbl-code" for="editWoCodeInput" class="block text-xs font-semibold text-slate-700 mb-1">Code</label>
          <input id="editWoCodeInput" type="text" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div class="lg:col-span-2">
          <label id="edit-lbl-title" for="editWoTitleInput" class="block text-xs font-semibold text-slate-700 mb-1">Title</label>
          <input id="editWoTitleInput" type="text" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div>
          <label id="edit-lbl-site" for="editWoSiteInput" class="block text-xs font-semibold text-slate-700 mb-1">Site</label>
          <input id="editWoSiteInput" type="text" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div>
          <label id="edit-lbl-prio" for="editWoPrioritySelect" class="block text-xs font-semibold text-slate-700 mb-1">Priority</label>
          <select id="editWoPrioritySelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option id="edit-opt-prio-low" value="נמוך">Low</option>
            <option id="edit-opt-prio-med" value="בינוני">Medium</option>
            <option id="edit-opt-prio-high" value="גבוה">High</option>
          </select>
        </div>

        <div>
          <label id="edit-lbl-status" for="editWoStatusSelect" class="block text-xs font-semibold text-slate-700 mb-1">Status</label>
          <select id="editWoStatusSelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option id="edit-opt-st-prog" value="בטיפול">In Progress</option>
            <option id="edit-opt-st-insp" value="דורש בדיקה">Needs Inspection</option>
            <option id="edit-opt-st-ok" value="תקין">Operational</option>
          </select>
        </div>

        <div class="lg:col-span-6 flex justify-end gap-2 mt-1">
          <button id="btn-wo-cancel" type="button" onclick="closeEditWorkOrder()" class="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-sm font-medium transition">
            Cancel
          </button>
          <button id="btn-wo-save" type="submit" class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium transition">
            Save Changes
          </button>
        </div>
      </form>
    </section>

    <!-- Work Orders Section -->
    <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm mb-6">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 id="t-sec-wo" class="text-lg font-bold">Work Orders</h2>
        <span id="woFilteredCount" class="text-xs font-medium text-slate-500"></span>
      </div>

      <!-- Work Orders Search & Filter Controls -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
        <div class="lg:col-span-2">
          <input
            id="woSearchInput"
            type="text"
            oninput="renderWorkOrders()"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <select
            id="woFilterPriority"
            onchange="renderWorkOrders()"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option id="flt-wo-prio-all" value="ALL">All Priorities</option>
            <option id="flt-wo-prio-high" value="גבוה">High</option>
            <option id="flt-wo-prio-med" value="בינוני">Medium</option>
            <option id="flt-wo-prio-low" value="נמוך">Low</option>
          </select>
        </div>

        <div>
          <select
            id="woFilterStatus"
            onchange="renderWorkOrders()"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option id="flt-wo-st-all" value="ALL">All Statuses</option>
            <option id="flt-wo-st-prog" value="בטיפול">In Progress</option>
            <option id="flt-wo-st-insp" value="דורש בדיקה">Needs Inspection</option>
            <option id="flt-wo-st-ok" value="תקין">Operational</option>
          </select>
        </div>

        <div>
          <button
            id="btn-wo-reset-filters"
            type="button"
            onclick="resetWorkOrderFilters()"
            class="w-full px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 text-sm font-medium transition"
          >
            Reset Filters
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500">
              <th id="th-wo-num" class="py-2 px-3 text-start">Code</th>
              <th id="th-wo-title" class="py-2 px-3 text-start">Title</th>
              <th id="th-wo-site" class="py-2 px-3 text-start">Site</th>
              <th id="th-wo-prio" class="py-2 px-3 text-start">Priority</th>
              <th id="th-wo-status" class="py-2 px-3 text-start">Status</th>
              <th id="th-wo-actions" class="py-2 px-3 text-start">Actions</th>
            </tr>
          </thead>
          <tbody id="woTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- Assets & PM Grid -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
          <h2 id="t-sec-assets" class="text-lg font-bold">Assets & Systems</h2>
          <span id="assetsFilteredCount" class="text-xs font-medium text-slate-500"></span>
        </div>

        <!-- Assets Search & Filter Controls -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
          <div class="sm:col-span-2">
            <input
              id="assetSearchInput"
              type="text"
              oninput="renderAssets()"
              class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <select
              id="assetFilterStatus"
              onchange="renderAssets()"
              class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option id="flt-ast-st-all" value="ALL">All Statuses</option>
              <option id="flt-ast-st-ok" value="תקין">Operational</option>
              <option id="flt-ast-st-insp" value="דורש בדיקה">Needs Inspection</option>
              <option id="flt-ast-st-prog" value="בטיפול">In Progress</option>
            </select>
          </div>
        </div>

        <ul id="assetsList" class="space-y-3 text-sm"></ul>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
        <h2 id="t-sec-pm" class="text-lg font-bold mb-4">Preventive Maintenance</h2>
        <ul id="pmList" class="space-y-3 text-sm"></ul>
      </div>
    </section>
  </div>

    function translateDbValue(value, map, lang) {
      if (!value) return '';
      const raw = String(value).trim();
      const entry = map[raw] || map[raw.toLowerCase()];
      if (!entry) return raw;
      return entry[lang] || entry.en || raw;
    }

    function normalizeStatusKey(status) {
      const raw = String(status || '').trim().toLowerCase();
      if (raw === 'תקין' || raw === 'operational') return 'תקין';
      if (raw === 'דורש בדיקה' || raw === 'needs inspection') return 'דורש בדיקה';
      return 'בטיפול';
    }

    function normalizePriorityKey(priority) {
      const raw = String(priority || '').trim().toLowerCase();
      if (raw === 'גבוה' || raw === 'high') return 'גבוה';
      if (raw === 'נמוך' || raw === 'low') return 'נמוך';
      return 'בינוני';
    }

    function getAssetStatusBadgeClass(statusKey) {
      if (statusKey === 'תקין') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
      if (statusKey === 'דורש בדיקה') return 'bg-amber-50 text-amber-800 border-amber-200';
      return 'bg-blue-50 text-blue-700 border-blue-200';
    }

    function getLocalizedField(record, field, lang) {
      if (!record) return '';
      const localizedKey = `${field}_${lang}`;
      const localizedVal = record[localizedKey];
      if (typeof localizedVal === 'string' && localizedVal.trim() !== '') {
        return localizedVal;
      }
      return record[field] || '';
    }

    function formatCountText(template, shown, total) {
      return template.replace('{shown}', shown).replace('{total}', total);
    }

    function renderWorkOrders() {
      const t = TRANSLATIONS[currentLang];
      const searchQuery = (document.getElementById('woSearchInput').value || '').trim().toLowerCase();
      const priorityFilter = document.getElementById('woFilterPriority').value;
      const statusFilter = document.getElementById('woFilterStatus').value;

      const filtered = cachedWorkOrders.filter(wo => {
        const woPriorityKey = normalizePriorityKey(wo.priority);
        const woStatusKey = normalizeStatusKey(wo.status);

        if (priorityFilter !== 'ALL' && woPriorityKey !== priorityFilter) return false;
        if (statusFilter !== 'ALL' && woStatusKey !== statusFilter) return false;

        if (searchQuery) {
          const code = String(wo.wo_number || '').toLowerCase();
          const titleLocalized = getLocalizedField(wo, 'title', currentLang).toLowerCase();
          const titleRaw = String(wo.title || '').toLowerCase();
          const siteLocalized = getLocalizedField(wo, 'site_name', currentLang).toLowerCase();
          const siteRaw = String(wo.site_name || '').toLowerCase();

          const matches =
            code.includes(searchQuery) ||
            titleLocalized.includes(searchQuery) ||
            titleRaw.includes(searchQuery) ||
            siteLocalized.includes(searchQuery) ||
            siteRaw.includes(searchQuery);

          if (!matches) return false;
        }

        return true;
      });

      document.getElementById('woFilteredCount').textContent = formatCountText(
        t.showingCount,
        filtered.length,
        cachedWorkOrders.length
      );

      const woBody = document.getElementById('woTableBody');
      if (filtered.length === 0) {
        woBody.innerHTML = `
          <tr>
            <td colspan="6" class="py-4 px-3 text-center text-slate-500">${t.noMatchingWo}</td>
          </tr>
        `;
        return;
      }

      woBody.innerHTML = filtered.map(wo => {
        const currentStatus = normalizeStatusKey(wo.status);
        const safeId = wo.id ? `'${String(wo.id).replace(/'/g, "\\'")}'` : 'null';
        const safeNum = `'${String(wo.wo_number || '').replace(/'/g, "\\'")}'`;

        return `
          <tr>
            <td class="py-2.5 px-3 font-medium">${wo.wo_number || ''}</td>
            <td class="py-2.5 px-3">${getLocalizedField(wo, 'title', currentLang)}</td>
            <td class="py-2.5 px-3">${getLocalizedField(wo, 'site_name', currentLang)}</td>
            <td class="py-2.5 px-3">${translateDbValue(wo.priority, PRIORITY_MAP, currentLang)}</td>
            <td class="py-2.5 px-3">
              <select
                onchange="updateWorkOrderStatus(${safeId}, ${safeNum}, this.value)"
                class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
              >
                <option value="בטיפול" ${currentStatus === 'בטיפול' ? 'selected' : ''}>${translateDbValue('בטיפול', STATUS_MAP, currentLang)}</option>
                <option value="דורש בדיקה" ${currentStatus === 'דורש בדיקה' ? 'selected' : ''}>${translateDbValue('דורש בדיקה', STATUS_MAP, currentLang)}</option>
                <option value="תקין" ${currentStatus === 'תקין' ? 'selected' : ''}>${translateDbValue('תקין', STATUS_MAP, currentLang)}</option>
              </select>
            </td>
            <td class="py-2.5 px-3">
              <div class="flex items-center gap-1.5">
                <button
                  type="button"
                  onclick="openEditWorkOrder(${safeNum})"
                  class="px-2.5 py-1 rounded-lg text-xs font-medium bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 transition"
                >${t.btnEdit}</button>
                <button
                  type="button"
                  onclick="deleteWorkOrder(${safeId}, ${safeNum})"
                  class="px-2.5 py-1 rounded-lg text-xs font-medium bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 transition"
                >${t.btnDelete}</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderAssets() {
      const t = TRANSLATIONS[currentLang];
      const searchQuery = (document.getElementById('assetSearchInput').value || '').trim().toLowerCase();
      const statusFilter = document.getElementById('assetFilterStatus').value;

      const filtered = cachedAssets.filter(a => {
        const assetStatusKey = normalizeStatusKey(a.status);
        if (statusFilter !== 'ALL' && assetStatusKey !== statusFilter) return false;

        if (searchQuery) {
          const code = String(a.asset_code || '').toLowerCase();
          const nameLocalized = getLocalizedField(a, 'name', currentLang).toLowerCase();
          const nameRaw = String(a.name || '').toLowerCase();
          const siteLocalized = getLocalizedField(a, 'site_name', currentLang).toLowerCase();
          const siteRaw = String(a.site_name || '').toLowerCase();
          const catLocalized = getLocalizedField(a, 'category', currentLang).toLowerCase();
          const catRaw = String(a.category || '').toLowerCase();

          const matches =
            code.includes(searchQuery) ||
            nameLocalized.includes(searchQuery) ||
            nameRaw.includes(searchQuery) ||
            siteLocalized.includes(searchQuery) ||
            siteRaw.includes(searchQuery) ||
            catLocalized.includes(searchQuery) ||
            catRaw.includes(searchQuery);

          if (!matches) return false;
        }

        return true;
      });

      document.getElementById('assetsFilteredCount').textContent = formatCountText(
        t.showingCount,
        filtered.length,
        cachedAssets.length
      );

      const assetsListEl = document.getElementById('assetsList');
      if (filtered.length === 0) {
        assetsListEl.innerHTML = `<li class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-center text-slate-500">${t.noMatchingAssets}</li>`;
        return;
      }

      assetsListEl.innerHTML = filtered.map(a => {
        const currentStatus = normalizeStatusKey(a.status);
        const safeId = a.id ? `'${String(a.id).replace(/'/g, "\\'")}'` : 'null';
        const safeCode = `'${String(a.asset_code || '').replace(/'/g, "\\'")}'`;
        const badgeClass = getAssetStatusBadgeClass(currentStatus);

        return `
          <li class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
            <div>
              <div class="font-semibold">${getLocalizedField(a, 'name', currentLang)} <span class="text-xs text-slate-500">(${a.asset_code || ''})</span></div>
              <div class="text-xs text-slate-500">${getLocalizedField(a, 'site_name', currentLang)} • ${getLocalizedField(a, 'category', currentLang)}</div>
            </div>
            <select
              onchange="updateAssetStatus(${safeId}, ${safeCode}, this.value)"
              class="text-xs font-semibold px-2.5 py-1 rounded-full border cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 ${badgeClass}"
            >
              <option value="תקין" ${currentStatus === 'תקין' ? 'selected' : ''}>${translateDbValue('תקין', STATUS_MAP, currentLang)}</option>
              <option value="דורש בדיקה" ${currentStatus === 'דורש בדיקה' ? 'selected' : ''}>${translateDbValue('דורש בדיקה', STATUS_MAP, currentLang)}</option>
              <option value="בטיפול" ${currentStatus === 'בטיפול' ? 'selected' : ''}>${translateDbValue('בטיפול', STATUS_MAP, currentLang)}</option>
            </select>
          </li>
        `;
      }).join('');
    }

    function renderPmList() {
      const pmListEl = document.getElementById('pmList');
      pmListEl.innerHTML = cachedPmList.map(pm => `
        <li class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
          <div>
            <div class="font-semibold">${getLocalizedField(pm, 'title', currentLang)} <span class="text-xs text-slate-500">(${pm.pm_code || ''})</span></div>
            <div class="text-xs text-slate-500">${getLocalizedField(pm, 'site_name', currentLang)} • ${getLocalizedField(pm, 'frequency', currentLang)}</div>
          </div>
          <span class="text-xs text-slate-600">${getLocalizedField(pm, 'assigned_technician', currentLang)}</span>
        </li>
      `).join('');
    }

    function openEditWorkOrder(woNumber) {
      const wo = cachedWorkOrders.find(item => String(item.wo_number) === String(woNumber));
      if (!wo) return;

      document.getElementById('editWoId').value = wo.id || '';
      document.getElementById('editWoOriginalNum').value = wo.wo_number || '';
      document.getElementById('editWoCodeInput').value = wo.wo_number || '';
      document.getElementById('editWoTitleInput').value = getLocalizedField(wo, 'title', currentLang) || wo.title || '';
      document.getElementById('editWoSiteInput').value = getLocalizedField(wo, 'site_name', currentLang) || wo.site_name || '';
      document.getElementById('editWoPrioritySelect').value = normalizePriorityKey(wo.priority);
      document.getElementById('editWoStatusSelect').value = normalizeStatusKey(wo.status);

      const section = document.getElementById('editWoSection');
      section.classList.remove('hidden');
      section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeEditWorkOrder() {
      document.getElementById('editWoSection').classList.add('hidden');
      document.getElementById('editWoForm').reset();
    }

    async function saveWorkOrderEdit(event) {
      event.preventDefault();
      const t = TRANSLATIONS[currentLang];
      const banner = document.getElementById('statusBanner');

      if (!SUPABASE_KEY || SUPABASE_KEY === 'YOUR_PUBLISHABLE_KEY_HERE') {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800 border border-amber-200';
        banner.textContent = t.keyMissing;
        return;
      }

      const woId = document.getElementById('editWoId').value.trim();
      const originalNum = document.getElementById('editWoOriginalNum').value.trim();
      const wo_number = document.getElementById('editWoCodeInput').value.trim();
      const title = document.getElementById('editWoTitleInput').value.trim();
      const site_name = document.getElementById('editWoSiteInput').value.trim();
      const priority = document.getElementById('editWoPrioritySelect').value;
      const status = document.getElementById('editWoStatusSelect').value;

      if (!wo_number || !title || !site_name) return;

      const updatePayload = { wo_number, title, site_name, priority, status };
      if (currentLang !== 'he' && TRANSLATIONS[currentLang]) {
        updatePayload[`title_${currentLang}`] = title;
        updatePayload[`site_name_${currentLang}`] = site_name;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      try {
        let query = client.from('work_orders').update(updatePayload);
        if (woId) {
          query = query.eq('id', woId);
        } else {
          query = query.eq('wo_number', originalNum);
        }

        const { error } = await query;
        if (error) throw error;

        closeEditWorkOrder();
        await loadAllData();

        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-emerald-50 text-emerald-800 border border-emerald-200';
        banner.textContent = t.woUpdated;
      } catch (err) {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-red-50 text-red-800 border border-red-200';
        banner.textContent = t.woUpdateError + (err.message || err);
      }
    }

    async function deleteWorkOrder(woId, woNumber) {
      const t = TRANSLATIONS[currentLang];
      const banner = document.getElementById('statusBanner');

      if (!window.confirm(t.confirmDeleteWo)) return;

      if (!SUPABASE_KEY || SUPABASE_KEY === 'YOUR_PUBLISHABLE_KEY_HERE') {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800 border border-amber-200';
        banner.textContent = t.keyMissing;
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      try {
        let query = client.from('work_orders').delete();
        if (woId) {
          query = query.eq('id', woId);
        } else {
          query = query.eq('wo_number', woNumber);
        }

        const { error } = await query;
        if (error) throw error;

        const editingNum = document.getElementById('editWoOriginalNum').value;
        if (editingNum && String(editingNum) === String(woNumber)) {
          closeEditWorkOrder();
        }

        await loadAllData();

        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-emerald-50 text-emerald-800 border border-emerald-200';
        banner.textContent = t.woDeleted;
      } catch (err) {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-red-50 text-red-800 border border-red-200';
        banner.textContent = t.woDeleteError + (err.message || err);
      }
    }

    async function createWorkOrder(event) {
      event.preventDefault();
      const t = TRANSLATIONS[currentLang];
      const banner = document.getElementById('statusBanner');

      if (!SUPABASE_KEY || SUPABASE_KEY === 'YOUR_PUBLISHABLE_KEY_HERE') {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800 border border-amber-200';
        banner.textContent = t.keyMissing;
        return;
      }

      const wo_number = document.getElementById('woCodeInput').value.trim();
      const title = document.getElementById('woTitleInput').value.trim();
      const site_name = document.getElementById('woSiteInput').value.trim();
      const priority = document.getElementById('woPrioritySelect').value;
      const status = document.getElementById('woStatusSelect').value;

      if (!wo_number || !title || !site_name) return;

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      try {
        const { error } = await client.from('work_orders').insert([
          { wo_number, title, site_name, priority, status }
        ]);

        if (error) throw error;

        document.getElementById('woForm').reset();
        await loadAllData();

        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-emerald-50 text-emerald-800 border border-emerald-200';
        banner.textContent = t.woCreated;
      } catch (err) {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-red-50 text-red-800 border border-red-200';
        banner.textContent = t.woCreateError + (err.message || err);
      }
    }

    async function updateWorkOrderStatus(woId, woNumber, newStatus) {
      const t = TRANSLATIONS[currentLang];
      const banner = document.getElementById('statusBanner');

      if (!SUPABASE_KEY || SUPABASE_KEY === 'YOUR_PUBLISHABLE_KEY_HERE') {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800 border border-amber-200';
        banner.textContent = t.keyMissing;
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      try {
        let query = client.from('work_orders').update({ status: newStatus });
        if (woId) {
          query = query.eq('id', woId);
        } else {
          query = query.eq('wo_number', woNumber);
        }

        const { error } = await query;
        if (error) throw error;

        await loadAllData();

        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-emerald-50 text-emerald-800 border border-emerald-200';
        banner.textContent = t.woStatusUpdated;
      } catch (err) {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-red-50 text-red-800 border border-red-200';
        banner.textContent = t.woStatusError + (err.message || err);
      }
    }

    async function updateAssetStatus(assetId, assetCode, newStatus) {
      const t = TRANSLATIONS[currentLang];
      const banner = document.getElementById('statusBanner');

      if (!SUPABASE_KEY || SUPABASE_KEY === 'YOUR_PUBLISHABLE_KEY_HERE') {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800 border border-amber-200';
        banner.textContent = t.keyMissing;
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      try {
        let query = client.from('assets').update({ status: newStatus });
        if (assetId) {
          query = query.eq('id', assetId);
        } else {
          query = query.eq('asset_code', assetCode);
        }

        const { error } = await query;
        if (error) throw error;

        await loadAllData();

        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-emerald-50 text-emerald-800 border border-emerald-200';
        banner.textContent = t.assetStatusUpdated;
      } catch (err) {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-red-50 text-red-800 border border-red-200';
        banner.textContent = t.assetStatusError + (err.message || err);
      }
    }

    async function loadAllData() {
      const t = TRANSLATIONS[currentLang];
      const banner = document.getElementById('statusBanner');

      if (!SUPABASE_KEY || SUPABASE_KEY === 'YOUR_PUBLISHABLE_KEY_HERE') {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800 border border-amber-200';
        banner.textContent = t.keyMissing;
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      try {
        const [assetsRes, woRes, pmRes] = await Promise.all([
          client.from('assets').select('*').order('asset_code', { ascending: true }),
          client.from('work_orders').select('*').order('created_at', { ascending: false }),
          client.from('preventive_maintenance').select('*').order('next_due_at', { ascending: true })
        ]);

        if (assetsRes.error) throw assetsRes.error;
        if (woRes.error) throw woRes.error;
        if (pmRes.error) throw pmRes.error;

        cachedAssets = assetsRes.data || [];
        cachedWorkOrders = woRes.data || [];
        cachedPmList = pmRes.data || [];

        document.getElementById('count-assets').textContent = cachedAssets.length;
        document.getElementById('count-wo').textContent = cachedWorkOrders.length;
        document.getElementById('count-pm').textContent = cachedPmList.length;

        renderWorkOrders();
        renderAssets();
        renderPmList();

        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-emerald-50 text-emerald-800 border border-emerald-200';
        banner.textContent = t.connected;
      } catch (err) {
        banner.className = 'mb-6 text-sm rounded-xl px-4 py-3 bg-red-50 text-red-800 border border-red-200';
        banner.textContent = t.loadError + (err.message || err);
      }
    }

    applyLanguage('en');
    loadAllData();
  </script>
</body>
</html>
